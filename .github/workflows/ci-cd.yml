name: FounderLink CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build & Verify Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build All Microservices
        run: |
          mvn clean package -DskipTests -q

  build-frontend:
    name: Build & Verify React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: founderlink-final/package-lock.json

      - name: Install & Build React 19 Frontend
        working-directory: founderlink-final
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
